<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Destino no encontrado</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f7c85, #1e3c72);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .emoji { font-size: 4rem; margin-bottom: 15px; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; }
        p { opacity: 0.9; max-width: 500px; margin-bottom: 25px; }
        a {
            background: #ffb703;
            color: #1e3c72;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="emoji">🧭</div>
    <h1>404 - Destino no encontrado</h1>
    <p>Parece que este camino no lleva a ningún lugar. Tal vez tomaste una ruta equivocada en tu viaje.</p>
    <a href="/">Volver al inicio</a>
</body>
</html>
